         seulement au robot de Google que ce domaine nous appartient. Le
         fichier public/ads.txt porte la même preuve du côté des
         annonceurs.
         🚨 Loi 25 (Québec), article 8.1 : le script de diffusion des
         annonces ne peut pas se trouver ici, parce qu'il se chargerait
         avant que la personne ait répondu quoi que ce soit. Il est
         maintenant injecté par src/components/layout/ConsentBanner.tsx,
