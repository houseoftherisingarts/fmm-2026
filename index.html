<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fmm-logo-embossed-silver.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1F33" />
    <meta name="description" content="Festival Médiéval de Montpellier — 25, 26 et 27 septembre 2026. Édition Caravanes & Saltimbanques." />

    <!-- Static OG/Twitter fallback: link scrapers (Facebook, WhatsApp, iMessage)
         don't run JS, so react-helmet tags never reach them. These are the
         defaults; react-helmet overrides them client-side per route. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Festival Médiéval de Montpellier — FMM 2026" />
    <meta property="og:description" content="25, 26 et 27 septembre 2026 · Édition Caravanes &amp; Saltimbanques. Marché, banquet, musique, tournois et chevaux à Montpellier, Québec." />
    <meta property="og:url" content="https://www.festivalmedievaldemontpellier.org/" />
    <meta property="og:image" content="https://www.festivalmedievaldemontpellier.org/hero/fmm-poster-card.jpg" />
    <meta property="og:site_name" content="Festival Médiéval de Montpellier" />
    <meta property="og:locale" content="fr_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.festivalmedievaldemontpellier.org/hero/fmm-poster-card.jpg" />
    <link rel="canonical" href="https://www.festivalmedievaldemontpellier.org/" />

    <!-- Preload navbar logo so it paints with first frame (used eagerly by NavBar). -->
    <link rel="preload" as="image" href="/fmm-logo-embossed-silver.png" />

    <!-- Fonts: preconnect first, then async-load with media trick to avoid render-block. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+SC:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+SC:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+SC:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Festival Médiéval de Montpellier — FMM 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
