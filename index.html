    {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Quand a lieu le Festival Médiéval de Montpellier 2026 ?","acceptedAnswer":{"@type":"Answer","text":"Du vendredi 25 au dimanche 27 septembre 2026. Le vendredi, le site est ouvert de 16 h 30 à 20 h et les portes ouvrent à 17 h. Le samedi, de 9 h 30 à 19 h, portes à 10 h. Le dimanche, de 9 h 30 à 16 h, portes à 10 h."}},{"@type":"Question","name":"Combien coûtent les billets ?","acceptedAnswer":{"@type":"Answer","text":"Une journée : enfant 20 $, adulte 35 $, famille 90 $. Trois jours : enfant 25 $, adulte 55 $, famille 125 $. Ce sont les montants affichés sur Zeffy. Le banquet médiéval se vend à part, 65 $ plus taxes. Tout s’achète en ligne sur Zeffy, qui ne prélève aucune commission."}},{"@type":"Question","name":"Mon billet d’une journée indique le vendredi 25 septembre. Puis-je venir samedi ou dimanche ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Zeffy imprime la date d’ouverture du festival sur tous les billets d’une journée, et cette date ne dit pas quel jour vous avez acheté. Votre billet vous ouvre les portes le vendredi, le samedi ou le dimanche, une seule fois, le jour que vous choisissez."}},{"@type":"Question","name":"Où se déroule le festival ?","acceptedAnswer":{"@type":"Answer","text":"Le festival se tient au 4, rue du Bosquet, à Montpellier, dans la Petite-Nation en Outaouais. Ottawa et Gatineau sont à environ 75 minutes de route. Il s’agit bien de Montpellier au Québec."}},{"@type":"Question","name":"Peut-on camper sur place ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Le camping festivalier se réserve sur Zeffy : 20 $ pour une tente et 40 $ pour une caravane. La page Hébergement présente aussi les hébergements partenaires de la Petite-Nation."}},{"@type":"Question","name":"Faut-il imprimer son billet ?","acceptedAnswer":{"@type":"Answer","text":"Nous vous le conseillons. Le réseau cellulaire est faible sur le site et il n’y a pas de Wi-Fi public à l’entrée. Imprimez votre confirmation Zeffy à la maison ou téléchargez-la sur votre appareil avant de partir."}},{"@type":"Question","name":"Les chiens sont-ils admis ?","acceptedAnswer":{"@type":"Answer","text":"Non, même en laisse. Des chevaux sont présents pendant tout le festival et notre couverture d’assurance tombe dès qu’un chien s’en approche."}},{"@type":"Question","name":"Peut-on payer par carte sur le site ?","acceptedAnswer":{"@type":"Answer","text":"Les terminaux deviennent capricieux quand le réseau faiblit, surtout aux heures de pointe. Apportez du comptant pour les kiosques, la nourriture et le bar. Le kiosque de la Petite Monnaie, à l’entrée, échange votre comptant contre la monnaie locale acceptée partout sur le site."}},{"@type":"Question","name":"Le festival est-il bilingue ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Le site web et le festival se vivent en français et en anglais."}}]}
